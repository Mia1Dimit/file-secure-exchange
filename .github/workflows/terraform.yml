name: File Secure Exchange — Terraform

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "terraform/**"
      - "policies/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "policies/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

env:
  TF_VERSION: "1.9.8"
  TF_ROOT: "terraform/infra"
  TF_VARS_FILE: "../environments/dev.tfvars"
  TF_STATE_KEY: "file-secure-exchange/dev/terraform.tfstate"
  TF_IN_AUTOMATION: "true"

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # PR: fmt → init → validate → plan → policy gate → infracost → comment
  # ─────────────────────────────────────────────────────────────────────────
  plan-pr:
    name: Terraform PR Checks
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-central-1

    steps:
      - name: Checkout (Head)
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout (Base — for Infracost diff)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── 1. Format ───────────────────────────────────────────────────────
      - name: Terraform Format
        run: terraform fmt -check -recursive head/${{ env.TF_ROOT }}

      # ── 2. Init ─────────────────────────────────────────────────────────
      - name: Terraform Init
        run: |
          terraform -chdir=head/${{ env.TF_ROOT }} init \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=eu-west-1" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -input=false

      # ── 3. Validate and create Lambda build dir  ──────────────────────────────────────
      - name: Terraform Validate
        run: terraform -chdir=head/${{ env.TF_ROOT }} validate

      - name: Prepare Lambda build dir
        run: mkdir -p /tmp/lambda-builds

      # ── 4. Plan ─────────────────────────────────────────────────────────
      - name: Terraform Plan
        run: |
          terraform -chdir=head/${{ env.TF_ROOT }} plan \
            -var-file=${{ env.TF_VARS_FILE }} \
            -out=tfplan \
            -no-color \
            -input=false

      - name: Export Plan (text — for PR comment)
        run: |
          terraform -chdir=head/${{ env.TF_ROOT }} show -no-color tfplan \
            > head/${{ env.TF_ROOT }}/tfplan.txt

      - name: Export Plan (JSON — for policy gate)
        run: |
          terraform -chdir=head/${{ env.TF_ROOT }} show -json tfplan \
            > head/${{ env.TF_ROOT }}/plan.json

      # ── 5. Policy gate ──────────────────────────────────────────────────
      # evaluate-terraform-policies evaluates policies/
      - name: Evaluate Terraform policies
        uses: serenis-health/evaluate-terraform-policies@v1
        id: evaluate-terraform-policies
        continue-on-error: false
        with:
          policy-files: head/policies
          plan-file-path: head/${{ env.TF_ROOT }}/plan.json
          exit-on-deny: "true"
          exit-on-warn: "false"

      # ── 6. Infracost diff ───────────────────────────────────────────────
      - name: Infracost Breakdown
        uses: infracost/actions/diff@v4
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY_FILE_X }}
          base-path: base
          head-path: head

      # ── 7. Artifacts and PR comment ─────────────────────────────────────
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-pr-${{ github.event.pull_request.number }}
          path: |
            head/${{ env.TF_ROOT }}/tfplan
            head/${{ env.TF_ROOT }}/tfplan.txt
          retention-days: 5

      - name: Comment plan summary on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('head/${{ env.TF_ROOT }}/tfplan.txt', 'utf8').slice(0, 60000);
            const body = [
              '### Terraform Plan',
              '',
              '> Plan generated for this PR.',
              '',
              '```hcl',
              plan,
              '```'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  # ─────────────────────────────────────────────────────────────────────────
  # Main: init → plan → apply (auto-approve)
  # ─────────────────────────────────────────────────────────────────────────
  apply-main:
    name: Terraform Apply on Main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-central-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform -chdir=${{ env.TF_ROOT }} init \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=eu-west-1" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -lock-timeout=5m \
            -input=false

      - name: Terraform Plan
        run: |
          terraform -chdir=${{ env.TF_ROOT }} plan \
            -var-file=${{ env.TF_VARS_FILE }} \
            -out=tfplan \
            -lock-timeout=5m \
            -no-color \
            -input=false

      - name: Terraform Apply
        run: |
          terraform -chdir=${{ env.TF_ROOT }} apply \
            -auto-approve \
            -lock-timeout=5m \
            tfplan
